name: quality

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall lotus_farm
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = list(Path("lotus_farm").rglob("*.json"))
          for path in files:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
          print(f"validated {len(files)} json files")
          PY
      - run: python -m pip install "openpyxl>=3.1.5,<4"
      - name: Run pure domain tests
        run: python -m unittest discover -s tests -v

  field-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/field_smoke.cjs
        env:
          LOTUS_BROWSER_ARTIFACTS: /tmp/lotus-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotus-field-browser
          path: /tmp/lotus-browser

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run --prefix frontend test
      - run: npm run --prefix frontend build
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/offline_queue.cjs
      - run: node tests/browser/quick_assign.cjs
        env:
          LOTUS_BROWSER_ARTIFACTS: /tmp/lotus-console-browser
      - run: node tests/browser/console_smoke.cjs
        env:
          LOTUS_BROWSER_ARTIFACTS: /tmp/lotus-console-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotus-console-browser
          path: /tmp/lotus-console-browser


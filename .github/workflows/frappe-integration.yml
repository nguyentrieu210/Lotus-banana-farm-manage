name: Frappe ERPNext integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test_root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=2s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          path: lotus-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server mariadb-client libmariadb-dev libcups2-dev pkg-config
          npm install -g yarn
          python -m pip install frappe-bench
      - name: Create disposable v16 bench
        run: |
          bench init bench --frappe-branch version-16 --skip-assets --python "$(command -v python)"
          cd bench
          bench get-app --branch version-16 --skip-assets erpnext https://github.com/frappe/erpnext
          bench get-app --skip-assets "$GITHUB_WORKSPACE/lotus-src"
          bench set-config -g root_login root
          bench set-config -g root_password test_root
          bench set-config -g admin_password test_admin
          sed -i '/^watch:/d; /^schedule:/d; /^web:/d; /^socketio:/d' Procfile
          bench start > bench_start.log 2>&1 &
          for n in $(seq 1 30); do
            redis-cli -p 13000 ping && break
            sleep 1
          done
          bench new-site lotus_test --db-host 127.0.0.1 --db-name lotus_test --db-password test_db
          bench --site lotus_test install-app erpnext
          bench --site lotus_test install-app lotus_farm
          bench --site lotus_test migrate
          bench --site lotus_test set-config allow_tests true --parse
      - name: Farm to stock integration tests
        working-directory: bench
        run: bench --site lotus_test run-tests --app lotus_farm --module lotus_farm.tests.test_integration
      - name: Two independent sales planners reserve the same supply
        working-directory: bench
        run: bench --site lotus_test execute lotus_farm.tests.concurrency.run
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frappe-integration-logs
          path: |
            bench/logs/
            bench/bench_start.log

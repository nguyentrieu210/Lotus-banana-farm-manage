name: HR Android APK
on:
  push:
    branches:
      - feat/lotus-hr-full-20261018
    paths:
      - 'android/hr-scanner/**'
      - '.github/workflows/hr-android-apk.yml'
  pull_request:
    paths:
      - 'android/hr-scanner/**'
      - '.github/workflows/hr-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/hr-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile HR Scanner APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Store installable APK
        uses: actions/upload-artifact@v4
        with:
          name: lotus-hr-android-debug-apk
          path: android/hr-scanner/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

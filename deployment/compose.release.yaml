# Single compose file for the Lotus stack (replaces lotus-runtime/compose.yaml + 30 overrides).
# Every Lotus service runs the same image, built from one git commit (Dockerfile.release).
#
#   docker compose -p lotus --env-file <private .env> -f deployment/compose.release.yaml up -d
#
# The env file (never committed) must define LOTUS_IMAGE, DB_ROOT_PASSWORD, LOTUS_ADMIN_PASSWORD.
# Port 8080 is bound to loopback only: public access goes through the host cloudflared tunnel
# (lotus.gpcds.site), which connects to localhost:8080. nginx trusts CF-Connecting-IP only from
# the Docker gateway so Activity Log records the real client IP.

x-lotus: &lotus
  image: ${LOTUS_IMAGE:?set LOTUS_IMAGE}
  networks: [frappe_network]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  deploy:
    restart_policy:
      condition: on-failure

x-redis-env: &redis-env
  FRAPPE_REDIS_CACHE: redis://redis-cache:6379
  FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

x-after-config: &after-config
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  configurator:
    <<: *lotus
    deploy:
      restart_policy:
        condition: none
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy

  create-site:
    <<: [*lotus, *after-config]
    deploy:
      restart_policy:
        condition: none
    entrypoint: [bash, -c]
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        if [ -d "sites/frontend" ]; then
          echo "Site frontend already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password="$$LOTUS_ADMIN_PASSWORD"
            --db-root-username=root --db-root-password="$$DB_ROOT_PASSWORD"
            --install-app erpnext --set-default frontend;
        fi;
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      LOTUS_ADMIN_PASSWORD: ${LOTUS_ADMIN_PASSWORD:?set LOTUS_ADMIN_PASSWORD}

  backend:
    <<: [*lotus, *after-config]
    environment:
      DB_HOST: db
      DB_PORT: "3306"

  frontend:
    <<: *lotus
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 172.18.0.1
      UPSTREAM_REAL_IP_HEADER: CF-Connecting-IP
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [backend, websocket]

  websocket:
    <<: [*lotus, *after-config]
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    environment: *redis-env

  queue-short:
    <<: [*lotus, *after-config]
    command: [bench, worker, --queue, "short,default"]
    environment: *redis-env

  queue-long:
    <<: [*lotus, *after-config]
    command: [bench, worker, --queue, "long,default,short"]
    environment: *redis-env

  scheduler:
    <<: [*lotus, *after-config]
    command: [bench, schedule]

  db:
    image: mariadb:11.8
    networks: [frappe_network]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      # Only used when the volume is first initialised; rotate an existing root with ALTER USER.
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  redis-queue:
    image: redis:6.2-alpine
    networks: [frappe_network]
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks: [frappe_network]
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge

{% macro card(title) -%}
<div lang="vi" style="font-family:Arial,sans-serif;max-width:560px;margin:24px auto;padding:32px;border:1px solid rgb(229,231,235);border-radius:16px;color:rgb(31,41,55)">
 <img src="{{ frappe.utils.get_url('/assets/lotus_farm/images/lotus-agritech-header-v2.png') }}" width="240" alt="Lotus Agritech" style="display:block;max-width:100%;height:auto;margin-bottom:28px">
 <h2 style="font-size:22px;line-height:1.4">{{ title|e }}</h2>
 {{ caller() }}
 <hr style="border:0;border-top:1px solid rgb(229,231,235);margin-top:28px">
 <p style="font-size:12px;color:rgb(107,114,128)">Lotus Agritech · Thư tự động từ hệ thống quản lý nông trường.</p>
</div>
{%- endmacro %}
{% macro button(url,text) -%}
<p style="margin:24px 0"><a href="{{ url|e }}" style="display:inline-block;background:rgb(196,50,36);color:white;text-decoration:none;padding:13px 22px;border-radius:8px;font-weight:bold">{{ text|e }}</a></p>
{%- endmacro %}

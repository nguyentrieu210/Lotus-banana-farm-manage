[project]
name = "lotus_farm"
authors = [{ name = "Nguyen Trieu" }]
description = "Lotus banana farm operations and harvest availability on Frappe/ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["openpyxl>=3.1.5,<4", "qrcode>=8,<9"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
